name: build-and-smoke
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22.0'
          cache-dependency-path: native/engine/go.sum
      - run: ./install.sh
      - run: .venv/bin/pytest -q
      - run: .venv/bin/ruff check src tests scripts --select F821,F822,F823
      - run: .venv/bin/python scripts/check_parity.py
      - run: go test -p 2 ./networks ./supervisor ./supervisor/committee ./supervisor/signal ./build ./core ./chain
        working-directory: native/engine
      - run: ./arbor run demo --output runs/ci --cleanup-db --json
      - run: ./arbor results runs/ci --plot --json
      - run: ./arbor run ablation --config configs/demo.yaml --dataset data/demo --output runs/ablation --cleanup-db --json
      - run: ./arbor train fusion --small --output runs/fusion --json
      - run: ./arbor train admission --small --output runs/admission --json
      - run: ./arbor run full --config configs/demo.yaml --dataset data/demo --admission-model runs/admission/model.json --fusion-model runs/fusion/model.json --output runs/trained --cleanup-db --json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-results
          path: |
            runs/ci/summary.*
            runs/ci/status.json
            runs/ci/controller.log
            runs/ci/failure.json
            runs/ci/cases/**/timeout_processes.json
            runs/ci/cases/**/native/**/*.log
            runs/ci/cases/**/native/gate/*.json
            runs/ci/cases/**/native/observer_result.json
            runs/ci/cases/**/native/forest/result.json
            runs/ci/figures/
            runs/ablation/summary.*
            runs/ablation/status.json
            runs/ablation/controller.log
            runs/ablation/failure.json
            runs/ablation/cases/**/timeout_processes.json
            runs/ablation/cases/**/native/**/*.log
            runs/ablation/cases/**/native/gate/*.json
            runs/ablation/cases/**/native/observer_result.json
            runs/ablation/cases/**/native/forest/result.json
            runs/fusion/complete.json
            runs/admission/complete.json
            runs/trained/summary.*
            runs/trained/status.json
            runs/trained/controller.log
            runs/trained/failure.json
